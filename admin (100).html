async function sp(){const name=$('n').value.trim(),category=$('c').value.trim(),price=parseFloat($('pr').value);if(!name||!category||isNaN(price))return toast('შეავსეთ სახელი, კატეგორია და ფასი.');

let pid=ed,error;if(ed){({error}=await sb.from('products').update(row).eq('id',ed))}else{const r=await sb.from('products').insert(row).select('id').single();error=r.error;pid=r.data&&r.data.id}

async function setstk(id){const p=D.p.find(x=>x.id==id);if(!p)return;const t=await pmt('მარაგის რაოდენობა (ცარიელი = არ ითვლის)',p.sk==null?'':p.sk);if(t===null)return;const v=t.trim()===''?null:Math.max(0,parseInt(t)||0);const{error}=await sb.from('products').update({stock:v}).eq('id',id);if(error)return toast(error.message);await stkLog(p,v,'ხელით შეცვლა');p.sk=v;draw()}
async function tsold(id){const p=D.p.find(x=>x.id==id);if(!p)return;const{error}=await sb.from('products').update({in_stock:!p.st}).eq('id',id);if(error)return toast(error.message);p.st=!p.st;alog(p.st?'მარაგში დაბრუნება':'SOLD OUT','პროდუქტი',id,p.n);draw()}
async function dp(id){if(!await cfm('წავშალოთ პროდუქტი?'))return;const pn=(D.p.find(x=>x.id==id)||{}).n;const{error}=await sb.from('products').delete().eq('id',id);if(error)return toast(error.message);alog('წაშლა','პროდუქტი',id,pn);load()}
const srt=l=>{const o=Array.isArray(D.s.order)?D.s.order:[],r=new Map(o.map((id,k)=>[String(id),k])),g=p=>r.has(String(p.id))?r.get(String(p.id)):1e9;return[...l].sort((x,y)=>g(x)-g(y))};
const pgN=()=>Math.max(1,+D.s.pgN||1);
const pgO=p=>{const k=+(D.s.pgOf||{})[p.id];return k>=1&&k<=pgN()?k:pgN()};

function pgMat(){const o={};D.p.forEach(p=>{o[p.id]=pgO(p)});D.s.pgOf=o}

function apager(full){if(V.t!='all')return full&&pgN()>1?'<small style="color:var(--mu)">გვერდებად დაყოფა „ყველა“ ტაბშია. აქ თითო პროდუქტის გვერდს მარჯვენა არჩევანით ცვლით.</small>':'';
 const n=pgN(),cn=k=>D.p.filter(p=>pgO(p)==k).length;let h='<div class="pgb">';
 for(let k=1;k<=n;k++)h+='<button class="'+(k==AP?'on':'')+'" onclick="agp('+k+')">გვერდი '+k+' <small>('+cn(k)+')</small></button>';
 h+='<button style="border-style:dashed" onclick="pgAdd()">➕ ახალი გვერდი</button>';

 h+='</div>';

 return h}

function mv(id,d){const v=D.p.filter(inL),i=v.findIndex(x=>x.id==id);if(i<0)return;const j=d=='top'?0:Math.max(0,Math.min(v.length-1,i+d));if(j==i)return;const ids=v.map(x=>x.id),[x]=ids.splice(i,1);ids.splice(j,0,x);const slots=[];D.p.forEach((p,k)=>{if(inL(p))slots.push(k)});const np=[...D.p];slots.forEach((k,n)=>np[k]=D.p.find(p=>p.id==ids[n]));D.p=np;D.s.order=np.map(p=>p.id);const y=scrollY;svs().then(ok=>{if(!ok)return load();draw().then(()=>scrollTo(0,y))})}

function hdread(){const g=k=>$('hd_'+k),h=HDA();['brand','top','h1','sub'].forEach(k=>h[k]=g(k).value.trim());['snow','hat','lights'].forEach(k=>h[k]=g(k).checked);h.snowN=+g('snowN').value||60;h.c1=g('c1').value;h.c2=g('c2').value;['fly'].forEach(k=>h[k]=g(k).checked);['flyN','flyTeam','flyEvery','flyWave','flySpeed','flySize','flyTop','flyBot','flyOp'].forEach(k=>h[k]=+g(k).value);['flyDir','flyKind','flyLayer','flyPath'].forEach(k=>h[k]=g(k).value);D.s.hd=h;return h}
async function hdsave(on){const h=hdread();if(typeof on=='boolean')h.on=on;const{error}=await sb.from('settings').upsert({id:1,data:D.s});toast(error?error.message:(h.on?'შენახულია. დღესასწაულის დიზაინი ჩართულია.':'შენახულია.'));if(!error){slog();draw()}}
function hdtog(){hdsave(!HDA().on)}

const DEFNOTE='⚠ საკვები დანამატი არ არის წამალი და არ ცვლის დაბალანსებულ კვებას. ორსულობისას, ლაქტაციისას, ქრონიკული დაავადების ან წამლის მიღებისას გამოყენებამდე გაიარეთ კონსულტაცია ექიმთან. შეინახეთ ბავშვებისთვის მიუწვდომელ ადგილას.',NTD={noticeBg:'#fff8e6',noticeTx:'#6b5a1e',footBg:'#14543a',footTx:'#d6eadd'};

const CPA=()=>{if(!Array.isArray(D.s.cpages))D.s.cpages=[];return D.s.cpages};
function cpl(){return CPA().map((c,i)=>`<div style="border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:10px"><div style="display:flex;gap:6px;align-items:center"><input value="${esc(c.t)}" placeholder="გვერდის სათაური" oninput="CPA()[${i}].t=this.value" style="flex:1;margin:0;font-weight:600"><button class="b o" ${sbt} onclick="cpop('up',${i})">↑</button><button class="b o" ${sbt} onclick="cpop('dn',${i})">↓</button><button class="b r" onclick="cpop('del',${i})">×</button></div><textarea rows="5" placeholder="გვერდის ტექსტი" oninput="CPA()[${i}].x=this.value" style="margin-top:8px">${esc(c.x)}</textarea></div>`).join('')}
async function cpop(op,i){gsync();['notice','noticeBg','noticeTx','footBg','footTx','noticeFont'].forEach(k=>{const e=$('s_'+k);if(e)D.s[k]=e.value});if($('s_noticeFs')){D.s.noticeFs=parseInt($('s_noticeFs').value)||12;D.s.noticeBold=$('s_noticeBold').checked};const L=CPA();
if(op=='add')L.push({id:Date.now(),t:'ახალი გვერდი',x:''});
else if(op=='del'){if(!await cfm('წავშალოთ გვერდი „'+(L[i].t||'')+'“?'))return;L.splice(i,1)}
else{const j=i+(op=='up'?-1:1);if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]]}
if(await svs())draw()}
function hcSave(){const e=i=>document.getElementById('s_'+i);if(!e('hc0'))return;const g=i=>e(i).value.replace(/,/g,' ').trim();D.s.hchips=[g('hc0'),g('hc1'),g('hc2'),e('hcx')?e('hcx').value:''].filter(Boolean).join(',')}
async function ss(){['brand','top','h1','sub','foot','maxPrice','delFee','freeFrom','delInfo','delHint','giftFrom','giftTxt','giftHint','okTitle','okText','okBtn','heroSec','tr1e','tr1t','tr2e','tr2t','tr3e','tr3t','goalsTitle','phone','hours','legal','fb','ig','wa','tg','yt','pt','tt','x','pgAbout','pgDelivery','pgReturns','pgTerms','pgPrivacy'].forEach(k=>D.s[k]=$('s_'+k).value);hcSave();D.s.notice=$('s_notice').value;D.s.noticeFs=Math.min(40,Math.max(10,parseInt($('s_noticeFs').value)||12));D.s.noticeFont=$('s_noticeFont').value;D.s.noticeBold=$('s_noticeBold').checked;D.s.hbgMode=$('s_hbgMode').value;D.s.hbgBlur=+$('s_hbgBlur').value;D.s.hbgOp=+$('s_hbgOp').value;Object.keys(NTD).forEach(k=>{const v=$('s_'+k).value;D.s[k]=v==NTD[k]?'':v});const{error}=await sb.from('settings').upsert({id:1,data:D.s});if(!error)slog();toast(error?error.message:'შენახულია.')}
const OST={new:['ახალი','#b7791f'],confirmed:['დადასტურებული','#2563eb'],shipped:['გაგზავნილი','#7c3aed'],delivered:['მიტანილი','#1f7a4d'],cancelled:['გაუქმებული','#b42318']}; let OF='all';
function ordF(k){OF=k;draw()}
async function ordSt(id,v){const{data:o0}=await sb.from('orders').select('status,items').eq('id',id).single();const old=(o0&&o0.status)||'new';const{error}=await sb.from('orders').update({status:v}).eq('id',id);if(error)return toast(error.message+' (გაუშვით supabase_setup.sql)');
 if(o0&&old!=v&&(v=='cancelled'||old=='cancelled'))await ordStk(o0.items,v=='cancelled'?1:-1,v=='cancelled'?'შეკვეთა გაუქმდა — მარაგი დაბრუნდა':'გაუქმება გაუქმდა — მარაგი ჩამოიწერა');
 alog('სტატუსი','შეკვეთა',id,(OST[v]||[v])[0]);draw()}
async function ordStk(items,dir,why){for(const i of items||[]){const p=(i.id&&D.p.find(x=>String(x.id)==String(i.id)))||D.p.find(x=>x.n==i.n);if(!p)continue;const{data:c}=await sb.from('products').select('stock').eq('id',p.id).single();if(!c||c.stock==null)continue;
 const before=+c.stock,after=Math.max(0,before+dir*(+i.q||0)),upd={stock:after};if(dir>0&&after>0)upd.in_stock=true;const{error}=await sb.from('products').update(upd).eq('id',p.id);if(error){toast(error.message);continue}
 await stkLog({id:p.id,n:p.n,sk:before},after,why);p.sk=after;if(upd.in_stock)p.st=true}}
async function vo(){const{data:o,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error)return`<div class="box">${esc(error.message)}</div>`;
const sk=x=>x.status||'new',cnt=k=>o.filter(x=>sk(x)==k).length,L=OF=='all'?o:o.filter(x=>sk(x)==OF);
const chip=(k,l,c)=>`<button onclick="ordF('${k}')" style="margin:0 6px 6px 0;padding:6px 12px;border-radius:999px;border:1px solid ${OF==k?'#14543a':'#dbe6df'};background:${OF==k?'#14543a':'#fff'};color:${OF==k?'#fff':'#17261e'};cursor:pointer;font:inherit;font-size:13px">${l} (${c})</button>`;
return`<div class="box"><h3>შეკვეთები (${o.length}) <button class="b o" style="margin-left:10px;padding:4px 10px;font-size:13px" onclick="ocsv()">⬇ Excel (CSV)</button></h3><div>${chip('all','ყველა',o.length)}${Object.keys(OST).map(k=>chip(k,OST[k][0],cnt(k))).join('')}</div>${L.map(x=>{const k=sk(x),c=(OST[k]||OST.new)[1];return`<div class="pi" style="align-items:flex-start;${k=='cancelled'?'opacity:.55':''}"><div class="m"><b>${esc(x.name)}</b> · ${esc(x.phone)}<br><small style="white-space:pre-line">${esc(x.address)} · ${new Date(x.created_at).toLocaleString('ka-GE')}</small><br>${x.items.map(i=>`${esc(i.n)} × ${i.q}`).join(', ')}${x.discount_note?`<br><small style="color:#1f7a4d;font-weight:600">${esc(x.discount_note)}</small>`:''}<br><b>${(+x.total+dfee(x)).toFixed(2)} ₾</b>${dfee(x)?` <small>(პროდუქცია ${(+x.total).toFixed(2)} + მიტანა ${dfee(x).toFixed(2)})</small>`:' <small>(მიტანის გარეშე)</small>'}</div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><select onchange="ordSt('${x.id}',this.value)" style="border:2px solid ${c};color:${c};border-radius:8px;padding:5px;font:inherit;font-weight:600">${Object.keys(OST).map(s=>`<option value="${s}"${s==k?' selected':''}>${OST[s][0]}</option>`).join('')}</select><button class="b o" onclick="opr('${x.id}')">ბეჭდვა</button><button class="b r" onclick="dor('${x.id}')">წაშლა</button></div></div>`}).join('')||'<p>შეკვეთები ჯერ არ არის.</p>'}</div>`}

/* ===== 🔔 მოლოდინში — „შემატყობინეთ, როცა მარაგში იქნება“ მოთხოვნები ===== */
async function vrq(){
 const{data:r,error}=await sb.from('restock_requests').select('*').order('created_at',{ascending:false});
 if(error)return`<div class="box">${esc(error.message)} (გაუშვით supabase_restock.sql)</div>`;
 const P=id=>(D.p||[]).find(x=>String(x.id)==String(id)),g={};
 r.forEach(x=>(g[x.product_id]=g[x.product_id]||[]).push(x));
 const L=Object.keys(g).sort((x,y)=>g[y].length-g[x].length);
 const fmt=t=>new Date(t).toLocaleString('ka-GE');
 return`<div class="box"><h3>🔔 მომლოდინეები (${r.length})</h3><p style="color:var(--mu);font-size:13px">კლიენტები, რომლებიც ელოდებიან პროდუქტის მარაგში დაბრუნებას. ზემოთაა ის პროდუქტები, რომლებსაც ყველაზე მეტი ადამიანი ელოდება. მარაგში დაბრუნების შემდეგ დაუკავშირდი და ჩანაწერები წაშალე.</p></div>`
 +(L.map(id=>{const p=P(id),n=g[id].length,ok=p&&p.st;
  return`<div class="box"><h3 style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${esc(p?p.n:'(წაშლილი პროდუქტი)')} <span style="background:#fff3d6;color:#8a5a00;border-radius:999px;padding:2px 12px;font-size:14px">${n} ელოდება</span>${ok?'<span style="background:#e6f4ec;color:#1f7a4d;border-radius:999px;padding:2px 12px;font-size:14px">✓ ახლა მარაგშია — დაუკავშირდი</span>':'<span style="background:#fbe6e1;color:#b42318;border-radius:999px;padding:2px 12px;font-size:14px">მარაგში არ არის</span>'}</h3>`
  +g[id].map(x=>`<div class="pi" style="align-items:center"><div class="m"><b><a href="tel:+995${esc(x.phone)}" style="color:inherit">${esc(x.phone)}</a></b> · <a href="https://wa.me/995${esc(x.phone)}" target="_blank" rel="noopener" style="color:#1f7a4d">WhatsApp</a><br><small>${fmt(x.created_at)}</small></div><button class="b r" onclick="rqDel('${x.id}')">წაშლა</button></div>`).join('')
  +`<button class="b r" style="margin-top:8px" onclick="rqDelP('${esc(String(id))}')">ყველას წაშლა (შეატყობინე)</button></div>`}).join('')||'<div class="box"><p>მოთხოვნები ჯერ არ არის.</p></div>')}
async function rqDel(id){const{error}=await sb.from('restock_requests').delete().eq('id',id);if(error)return toast(error.message);draw()}

async function psv(){const code=$('pm_c').value.trim().toUpperCase().replace(/\s+/g,''),v=parseFloat($('pm_v').value),k=$('pm_k').value;if(!code||!(v>0))return toast('შეავსეთ კოდი და ოდენობა.');if(k=='pct'&&v>100)return toast('პროცენტი 100-ზე მეტი ვერ იქნება.');const n=x=>$(x).value.trim()===''?null:parseFloat($(x).value),row={kind:k,value:v,min_total:n('pm_n'),max_uses:n('pm_u'),expires_at:$('pm_e').value?$('pm_e').value+'T23:59:59+04:00':null,active:$('pm_a').checked};

mall>${p.pr.toFixed(2)} ₾</small></label>`).join('')}</div><button class="b" onclick="bsv()">${BE?'შენახვა':'შექმნა'}</button>${BE?' <button class="b o" onclick="BE=null;BI=[];draw()">გაუქმება</button>':''}</div>

const bflt=q=>{q=q.toLowerCase();document.querySelectorAll('.bnr').forEach(r=>r.style.display=r.dataset.s.includes(q)?'flex':'none')};
async function bsv(){const pids=[...document.querySelectorAll('.bnc:checked')].map(c=>c.value),sp=parseFloat($('bn_sp').value),ic=$('bn_ic').value.trim(),d=$('bn_d').value,n=$('bn_n').value.trim(),gs=pids.reduce((t,i)=>t+((D.p.find(p=>String(p.id)==i)||{}).pr||0),0);if(pids.length<2)return toast('აირჩიეთ მინიმუმ 2 პროდუქტი.');if(!n||!(sp>0))return toast('შეავსეთ სახელი და ბანდლის ფასი.');if(sp>=gs)return toast('ბანდლის ფასი უნდა იყოს პროდუქტების ჯამზე ('+gs.toFixed(2)+' ₾) ნაკლები.');const imgs=[...BI];const L=BA(),e=L.find(x=>x.id==BE);if(e){Object.assign(e,{n,sp,pids,imgs,ic,d});delete e.t;delete e.v}else L.push({id:'b'+Date.now(),n,sp,pids,imgs,ic,d,on:true});if(await svs()){BE=null;BI=[];toast('შენახულია.');draw()}}

function vvr(){const G=VA();return`<div class="box"><h3>ვარიანტები ერთ პროდუქტზე</h3><p style="color:var(--mu);font-size:13px;line-height:1.7">გააერთიანე რამდენიმე პროდუქტი (მაგ. პროტეინის არომატები) ერთ ბარათად. თითოეულს თავისი ფასი, მარაგი და ფოტოები რჩება; საიტზე ერთი ბარათი გამოჩნდება, პროდუქტის გვერდზე კი არჩევანი. თუ მახასიათებლებში წერია „არომატი: ...“, დამატებისას სახელად ავტომატურად ჩაისვამს.</p>
${G.map((g,i)=>`<div style="border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px"><div class="row"><div><label>სახელი ბარათზე (ცარიელი = პირველი პროდუქტის)</label><input value="${esc(g.dn||'')}" onchange="vset(${i},'dn',this.value)"></div><div><label>რას ირჩევენ (არომატი / წონა / ზომა)</label><input value="${esc(g.t||'')}" onchange="vset(${i},'t',this.value)"></div></div>${g.pids.map(id=>{const p=D.p.find(x=>String(x.id)==id);return p?`<div class="pi" style="padding:6px 0"><div class="m"><b>${esc(p.n)}</b><br><small>${p.pr.toFixed(2)} ₾ · მარაგი: ${p.sk==null?'∞':p.sk}</small></div><input value="${esc(g.labels[id]||'')}" placeholder="${esc(g.t||'ვარიანტი')}" style="width:170px;margin:0" onchange="vlb(${i},'${id}',this.value)"><button class="b r" onclick="vrm(${i},'${id}')">×</button></div>`:''}).join('')}<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">+ პროდუქტის დამატება</summary><input placeholder="🔍 ძებნა..." value="${esc(VQ[i]||'')}" oninput="VQ[${i}]=this.value;$('vp${i}').innerHTML=vpl(${i})" style="margin:8px 0"><div id="vp${i}" style="max-height:260px;overflow:auto">${vpl(i)}</div></details><button class="b r" style="margin-top:10px" onclick="vdl(${i})">ჯგუფის წაშლა</button></div>`).join('')||'<p>ჯგუფი ჯერ არ არის.</p>'}<button class="b" onclick="vad()">+ ახალი ჯგუფი</button></div>`}
